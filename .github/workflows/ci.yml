name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Build + link/anchor check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Strict build fails on broken link *targets*, nav errors, etc.
      - name: mkdocs build --strict
        run: mkdocs build --strict

      # Strict build does NOT fail on broken #anchor fragments; this does.
      - name: Check internal links and anchors
        run: python scripts/check_doc_links.py
