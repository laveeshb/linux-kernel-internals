name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # `--strict` + the `validation.links.anchors: warn` setting in
      # mkdocs.yml fails the build on any broken internal link OR broken
      # #anchor fragment. Nav errors and unrecognized links fail too.
      - name: mkdocs build --strict
        run: mkdocs build --strict
