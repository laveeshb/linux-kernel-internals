site_name: Linux Kernel Internals
site_description: Documentation about Linux kernel internals, design decisions, and the journey of contributing
site_url: https://kernel-internals.org/

theme:
  name: material
  logo: assets/tux.svg
  favicon: assets/tux-outline.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.share

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list

plugins:
  - search

# Fail the build on broken internal links AND broken #anchor fragments.
# MkDocs defaults `anchors` to `info`, so `--strict` would otherwise let a
# wrong section slug through; `warn` promotes it to a strict-mode failure.
validation:
  links:
    anchors: warn
    unrecognized_links: warn

# Open external links in new tab
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/laveeshb/linux-kernel-internals
    - icon: fontawesome/solid/comments
      link: https://github.com/laveeshb/linux-kernel-internals/discussions
      name: Discussions
    - icon: fontawesome/solid/bug
      link: https://github.com/laveeshb/linux-kernel-internals/issues
      name: Issues

# This makes external links open in new tabs
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js

